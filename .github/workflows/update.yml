name: Auto-update logitune

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
  push:
    branches:
      - trunk

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check latest release
        id: release
        run: |
          latest=$(gh release view --repo mmaher88/logitune --json tagName -q .tagName)
          current=$(grep -oP 'version = "\K[^"]+' flake.nix | head -1)
          echo "latest=${latest#v}" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "${latest#v}" = "$current" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compute new hash
        if: steps.release.outputs.up_to_date == 'false'
        id: hash
        run: |
          new_version="${{ steps.release.outputs.latest }}"
          new_hash=$(nix --extra-experimental-features 'nix-command flakes' \
            store prefetch-file --json \
            --unpack \
            "https://github.com/mmaher88/logitune/archive/refs/tags/v${new_version}.tar.gz" \
            | jq -r .hash)
          echo "hash=$new_hash" >> "$GITHUB_OUTPUT"

      - name: Update flake.nix
        if: steps.release.outputs.up_to_date == 'false'
        run: |
          new_version="${{ steps.release.outputs.latest }}"
          new_hash="${{ steps.hash.outputs.hash }}"
          sed -i "s/version = \".*\";/version = \"${new_version}\";/" flake.nix
          sed -i "s|hash = \"sha256-.*\";|hash = \"${new_hash}\";|" flake.nix

      - name: Open pull request
        if: steps.release.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "logitune: ${{ steps.release.outputs.current }} -> ${{ steps.release.outputs.latest }}"
          title: "logitune: ${{ steps.release.outputs.current }} -> ${{ steps.release.outputs.latest }}"
          body: |
            Automated update to [v${{ steps.release.outputs.latest }}](https://github.com/mmaher88/logitune/releases/tag/v${{ steps.release.outputs.latest }}).
          branch: "update/logitune-${{ steps.release.outputs.latest }}"
          delete-branch: true
